<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOXEN | Wear Your Mind</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

<h1>NOXEN</h1>

<p class="tagline">Wear Your Mind.</p>

</header>

<section class="gallery">

<img src="images/black.jpg" alt="Black T-shirt">

<img src="images/white.jpg" alt="White T-shirt">

</section>

<section class="product">

<h2>Premium Oversized T-Shirt</h2>

<p class="price">170 DH</p>

<p class="delivery">
🚚 Livraison partout au Maroc
<br>
Les frais de livraison sont à la charge du client.
</p>

<form id="orderForm">

<input
type="text"
id="firstname"
placeholder="Prénom"
required>

<input
type="text"
id="lastname"
placeholder="Nom"
required>

<input
type="text"
id="address"
placeholder="Adresse complète"
required>

<input
type="tel"
id="phone"
placeholder="Numéro de téléphone"
required>

<select id="color">

<option>Noir</option>

<option>Blanc</option>

</select>

<select id="size">

<option>M</option>

<option>L</option>

<option>XL</option>

</select>

<input
type="number"
id="quantity"
min="1"
value="1">

<h3 id="total">
Total :
170 DH
</h3>

<button
type="button"
onclick="sendOrder()">

Commander sur WhatsApp

</button>

</form>

</section>

<footer>

© 2026 NOXEN

</footer>

<script src="script.js"></script>

</body>

</html>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
line-height:1.6;
}

header{
text-align:center;
padding:60px 20px 40px;
}

header h1{
font-size:65px;
font-weight:800;
letter-spacing:12px;
color:#fff;
}

.tagline{
margin-top:10px;
font-size:18px;
color:#aaa;
letter-spacing:4px;
}

.gallery{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
padding:20px;
}

.gallery img{
width:100%;
border-radius:20px;
display:block;
box-shadow:0 10px 35px rgba(255,255,255,.08);
transition:.35s;
}

.gallery img:hover{
transform:scale(1.03);
}

.product{
max-width:700px;
margin:50px auto;
background:#111;
padding:35px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,255,255,.06);
}

.product h2{
text-align:center;
margin-bottom:20px;
font-size:34px;
}

.price{
text-align:center;
font-size:45px;
font-weight:700;
margin-bottom:10px;
}

.delivery{
text-align:center;
color:#bdbdbd;
margin-bottom:30px;
}

form{
display:flex;
flex-direction:column;
gap:18px;
}

input,
select{
width:100%;
padding:16px;
background:#1b1b1b;
border:1px solid #333;
border-radius:12px;
color:#fff;
font-size:16px;
transition:.3s;
}

input:focus,
select:focus{
border-color:#25D366;
outline:none;
}

#total{
margin-top:10px;
text-align:center;
font-size:30px;
font-weight:bold;
}

button{
margin-top:20px;
padding:18px;
border:none;
border-radius:14px;
background:#25D366;
color:#fff;
font-size:20px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1ebd5b;
transform:translateY(-3px);
}

footer{
margin-top:60px;
padding:25px;
text-align:center;
color:#777;
border-top:1px solid #222;
}

@media(max-width:768px){

header h1{
font-size:42px;
letter-spacing:6px;
}

.tagline{
font-size:15px;
}

.product{
margin:20px;
padding:25px;
}

.price{
font-size:36px;
}

.gallery{
grid-template-columns:1fr;
padding:15px;
}

button{
font-size:18px;
}

}
</style>
<script>
const tshirtPrice = 170;

const quantityInput = document.getElementById("quantity");
const total = document.getElementById("total");

function updateTotal() {
    let quantity = parseInt(quantityInput.value) || 1;

    if (quantity < 1) {
        quantity = 1;
        quantityInput.value = 1;
    }

    total.innerHTML = "Total : " + (quantity * tshirtPrice) + " DH";
}

quantityInput.addEventListener("input", updateTotal);

updateTotal();

function sendOrder() {

    const firstname = document.getElementById("firstname").value;
    const lastname = document.getElementById("lastname").value;
    const address = document.getElementById("address").value;
    const phone = document.getElementById("phone").value;
    const color = document.getElementById("color").value;
    const size = document.getElementById("size").value;
    const quantity = document.getElementById("quantity").value;

    if (
        firstname === "" ||
        lastname === "" ||
        address === "" ||
        phone === ""
    ) {
        alert("Veuillez remplir tous les champs.");
        return;
    }

    const totalPrice = tshirtPrice * quantity;

    const message =
`🖤 NOXEN

🛒 Nouvelle Commande

👤 Prénom : ${firstname}

👤 Nom : ${lastname}

📍 Adresse :
${address}

📞 Téléphone :
${phone}

👕 Couleur : ${color}

📏 Taille : ${size}

📦 Quantité : ${quantity}

💰 Prix : 170 DH

💵 Total : ${totalPrice} DH

🚚 Livraison partout au Maroc
(Frais de livraison à la charge du client)`;

    const whatsapp =
"https://wa.me/212663769429?text=" + encodeURIComponent(message);

    window.location.href = whatsapp;

}
</script>
